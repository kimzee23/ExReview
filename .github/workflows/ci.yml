
name: ExReview CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run project checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify application imports
        run: uv run python -c "from exreview.main import app; print('ExReview application loaded successfully')"
        env:
          PYTHONPATH: src
      - name: Run tests
        run: uv run pytest